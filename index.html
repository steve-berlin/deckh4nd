<!doctype html>
<!-- Tells the browser: this is modern HTML5. Always the first line. -->
<html lang="en"> <!-- Page language; helps screen readers and translators. -->
<head>
  <!-- <head> = info ABOUT the page. Nothing here is shown on screen. -->
  <meta charset="utf-8"> <!-- Text encoding: supports every language and emoji. -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Fit phone screens instead of showing a tiny zoomed-out desktop page. -->
  <meta name="color-scheme" content="light dark"> <!-- Free dark mode when the device uses it. -->
  <title>pyweb-service-template</title> <!-- Text on the browser tab. -->
</head>
<body>
  <!-- <body> = everything you actually see. -->
  <h1>Send to host</h1>
  <!-- method="post" sends the typed data hidden in the request, not in the
       address bar. No action="..." means "send it back to this same page",
       where server.py's do_POST picks it up. -->
  <form method="post">
    <!-- Each <label> wraps its <input>: clicking the words focuses the box,
         and screen readers read the label aloud.
         name="i1".."i5" are the keys server.py looks for; rename both together.
         maxlength stops typing at 200 characters (server.py checks again,
         because people can skip this page and send data directly). -->
    <p><label>Input 1 <input name="i1" maxlength="200"></label></p>
    <p><label>Input 2 <input name="i2" maxlength="200"></label></p>
    <p><label>Input 3 <input name="i3" maxlength="200"></label></p>
    <p><label>Input 4 <input name="i4" maxlength="200"></label></p>
    <p><label>Input 5 <input name="i5" maxlength="200"></label></p>
    <button>Send</button> <!-- A button inside a form submits it by default. -->
  </form>
</body>
</html>
